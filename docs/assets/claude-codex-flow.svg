<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">远端 Claude 指挥本机 Codex</title>
  <desc id="desc">Linux 服务器上的 Claude Desktop 经 hostmcp 和 Tailscale 私网 mTLS 连接 Windows HostControl。本机授权校验后启动 Docker Linux 容器中的 Codex CLI，在批准项目的独立代码副本执行任务。Claude 按需取回文字报告、原生 PNG 或 JPEG 图片及补丁，再根据结果显式发起下一轮。Codex CLI 使用独立登录连接模型服务，不操控已有 Codex 桌面对话，不自动提交、推送或合并。</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="m2 1 4 3.5L2 8" fill="none" stroke="#2465d1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="m2 1 4 3.5L2 8" fill="none" stroke="#187a68" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="648" rx="26" fill="url(#canvas)" stroke="#dce5ef"/>
  <g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif">
    <text x="38" y="51" fill="#1c2d45" font-size="26" font-weight="700">Claude 负责指挥，Codex 接手执行</text>
    <text x="38" y="83" fill="#60738b" font-size="16">分派任务，读取结果，再决定下一步。</text>

    <rect x="28" y="112" width="316" height="420" rx="22" fill="#fff" stroke="#dce5ef"/>
    <text x="52" y="147" fill="#60738b" font-size="16" font-weight="600">Linux 服务器</text>
    <rect x="52" y="174" width="268" height="152" rx="16" fill="#f2f6fe" stroke="#dce7f8"/>
    <g transform="translate(72 194)" stroke="#2465d1" stroke-width="1.7" fill="none" stroke-linecap="round"><rect width="27" height="20" rx="4"/><path d="M8 26h11M13.5 20v6"/></g>
    <text x="72" y="254" fill="#1c2d45" font-size="23" font-weight="700">Claude Desktop</text>
    <text x="72" y="284" fill="#60738b" font-size="16">拆解需求 · 查看报告与图片</text>
    <rect x="52" y="351" width="268" height="64" rx="13" fill="#fff" stroke="#dce5ef"/>
    <text x="72" y="379" fill="#1c2d45" font-size="18" font-weight="600">hostmcp</text>
    <text x="72" y="401" fill="#60738b" font-size="14">将工具调用转发给 Windows</text>
    <path d="M186 327v21" stroke="#2465d1" stroke-width="1.7" marker-end="url(#blue)"/>
    <text x="52" y="454" fill="#60738b" font-size="15">读取状态 / 取回结果 / 显式续轮</text>
    <text x="52" y="484" fill="#60738b" font-size="15">通过已配对的 MCP 工具完成</text>

    <rect x="478" y="112" width="694" height="420" rx="22" fill="#fff" fill-opacity=".66" stroke="#dce5ef"/>
    <text x="502" y="147" fill="#60738b" font-size="16" font-weight="600">你的 Windows 电脑</text>
    <rect x="502" y="174" width="272" height="242" rx="16" fill="#fff" stroke="#dce5ef"/>
    <g transform="translate(523 196)" stroke="#2465d1" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m12 0-10 4v8c0 6 5 10 10 12 5-2 10-6 10-12V4L12 0Z"/><path d="m7 11 4 4 7-8"/></g>
    <text x="523" y="255" fill="#1c2d45" font-size="23" font-weight="700">HostControl</text>
    <text x="523" y="286" fill="#60738b" font-size="16">本机代理 · 校验限时授权</text>
    <path d="M523 305h230" stroke="#e4ebf3"/>
    <text x="523" y="337" fill="#60738b" font-size="15">限定项目、分支与源提交</text>
    <text x="523" y="365" fill="#60738b" font-size="15">管理任务、轮数与登记产物</text>
    <text x="523" y="393" fill="#60738b" font-size="15">暂停授权时取消执行</text>

    <rect x="821" y="174" width="327" height="242" rx="16" fill="#f0f7f6" stroke="#d4e5e1"/>
    <text x="842" y="205" fill="#187a68" font-size="15" font-weight="600">Docker · Linux 容器</text>
    <text x="842" y="255" fill="#1c2d45" font-size="24" font-weight="700">Codex CLI</text>
    <text x="842" y="286" fill="#60738b" font-size="16">真实模型执行 · 独立代码副本</text>
    <path d="M842 305h285" stroke="#d4e5e1"/>
    <text x="842" y="337" fill="#60738b" font-size="15">编码 / 测试 / 代码审查</text>
    <text x="842" y="365" fill="#60738b" font-size="15">独立登录连接模型服务</text>
    <text x="842" y="393" fill="#60738b" font-size="15">不操控已有 Codex 桌面对话</text>

    <text x="411" y="218" text-anchor="middle" fill="#2465d1" font-size="14" font-weight="600">发起任务</text>
    <path d="M345 237h153" stroke="#2465d1" stroke-width="2" fill="none" marker-end="url(#blue)"/>
    <text x="411" y="276" text-anchor="middle" fill="#60738b" font-size="13">Tailscale 私网</text>
    <text x="411" y="298" text-anchor="middle" fill="#60738b" font-size="13">mTLS 加密</text>
    <path d="M776 237h40" stroke="#2465d1" stroke-width="2" marker-end="url(#blue)"/>

    <path d="M984 418v51H639v-50" fill="none" stroke="#187a68" stroke-width="1.8" marker-end="url(#green)"/>
    <rect x="689" y="446" width="306" height="43" rx="12" fill="#f0f7f6" stroke="#d4e5e1"/>
    <text x="842" y="473" text-anchor="middle" fill="#187a68" font-size="15" font-weight="600">文字报告 · 图片 · 文件与补丁</text>
    <path d="M500 383H348" stroke="#187a68" stroke-width="2" marker-end="url(#green)"/>
    <text x="418" y="360" text-anchor="middle" fill="#187a68" font-size="14" font-weight="600">按需取回结果</text>

    <path d="M186 535v29h453v-29" fill="none" stroke="#2465d1" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#blue)"/>
    <rect x="233" y="548" width="358" height="31" rx="15" fill="#edf3fd"/>
    <text x="412" y="569" text-anchor="middle" fill="#2465d1" font-size="15">Claude 根据结果，通过 MCP 发起下一轮</text>
    <text x="600" y="615" text-anchor="middle" fill="#60738b" font-size="15">Codex 能力单独启用 · 原生图片通过 MCP 返回 · 不自动提交、推送或合并</text>
  </g>
</svg>
