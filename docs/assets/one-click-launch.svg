<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">双击启动，从 Windows 到云端 Claude</title>
  <desc id="desc">五步启动流程，分为 Windows 本机、远程桌面和 Linux Claude 三个阶段。双击 Start-Claude.cmd，复用或启动 HostControl，打开远程桌面，登录或重连 Linux，启动或复用 Claude Desktop。执行 Windows 操作前，需要本机限时授权。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l3 2.5L1 6" fill="none" stroke="#6b8394" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1118" height="358" rx="18" fill="#f8fafc" stroke="#dce5ed"/>
  <g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif">
    <text x="30" y="39" font-size="18" font-weight="700" fill="#142e40">一次双击，串起整个启动流程</text>
    <text x="1090" y="38" text-anchor="end" font-size="12" fill="#587185">复用已有配置与运行状态</text>
    <path d="M30 58H1090" stroke="#dce5ed"/>

    <!-- Windows: the entry point and the local execution program. -->
    <rect x="24" y="78" width="340" height="250" rx="12" fill="#fff" stroke="#dce5ed"/>
    <path d="M45 102h8v8h-8zm11 0h8v8h-8zm-11 11h8v8h-8zm11 0h8v8h-8z" fill="#2563a6"/>
    <text x="77" y="117" font-size="15" font-weight="700" fill="#244f77">Windows 本机</text>
    <text x="340" y="116" text-anchor="end" font-size="11" fill="#71869a">启动入口</text>
    <path d="M46 134H342" stroke="#e8eef4"/>
    <path d="M57 177v63" stroke="#c7d9e9" stroke-width="2"/>
    <circle cx="57" cy="171" r="13" fill="#eaf2fc"/>
    <text x="57" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#2563a6">1</text>
    <text x="82" y="169" font-size="14" font-weight="600" fill="#183449">双击启动文件</text>
    <rect x="82" y="181" width="172" height="26" rx="5" fill="#eff4f9"/>
    <text x="92" y="198" font-family="Consolas,monospace" font-size="13" font-weight="600" fill="#244f77">Start-Claude.cmd</text>
    <circle cx="57" cy="242" r="13" fill="#eaf2fc"/>
    <text x="57" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#2563a6">2</text>
    <text x="82" y="240" font-size="14" font-weight="600" fill="#183449">启动或复用 HostControl</text>
    <text x="82" y="264" font-size="12" fill="#60798b">已有代理继续运行，保留当前会话</text>
    <text x="46" y="305" font-size="11" fill="#71869a">保留完整启动目录</text>

    <!-- RDP: user authentication stays visible and unchanged. -->
    <path d="M367 203h18" stroke="#6b8394" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="390" y="78" width="340" height="250" rx="12" fill="#fff" stroke="#dce5ed"/>
    <g transform="translate(411 102)" fill="none" stroke="#2563a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect width="22" height="15" rx="2"/>
      <path d="M11 15v5m-5 0h10m-9-13h8m-3-3 3 3-3 3"/>
    </g>
    <text x="443" y="117" font-size="15" font-weight="700" fill="#244f77">远程桌面</text>
    <text x="706" y="116" text-anchor="end" font-size="11" fill="#71869a">连接 Linux</text>
    <path d="M412 134H708" stroke="#e8eef4"/>
    <path d="M423 177v63" stroke="#c7d9e9" stroke-width="2"/>
    <circle cx="423" cy="171" r="13" fill="#eaf2fc"/>
    <text x="423" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#2563a6">3</text>
    <text x="448" y="169" font-size="14" font-weight="600" fill="#183449">打开远程桌面</text>
    <text x="448" y="194" font-size="12" fill="#60798b">使用已配置的私网连接</text>
    <circle cx="423" cy="242" r="13" fill="#eaf2fc"/>
    <text x="423" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#2563a6">4</text>
    <text x="448" y="240" font-size="14" font-weight="600" fill="#183449">登录或重连 Linux</text>
    <text x="448" y="264" font-size="12" fill="#60798b">按原有方式登录你的桌面账号</text>
    <text x="412" y="305" font-size="11" fill="#71869a">启动脚本不保存登录密码</text>

    <!-- Claude is ready to use; Windows control remains separately authorized. -->
    <path d="M733 203h18" stroke="#6b8394" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="756" y="78" width="340" height="250" rx="12" fill="#f0faf7" stroke="#b9dbd1"/>
    <g transform="translate(778 103)" fill="none" stroke="#147d68" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 0l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    </g>
    <text x="809" y="117" font-size="15" font-weight="700" fill="#176653">Claude Desktop</text>
    <text x="1072" y="116" text-anchor="end" font-size="11" fill="#548575">继续工作</text>
    <path d="M778 134H1074" stroke="#d4e9e1"/>
    <circle cx="789" cy="171" r="13" fill="#d7efe5"/>
    <text x="789" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#147d68">5</text>
    <text x="814" y="169" font-size="14" font-weight="600" fill="#184b3c">启动或复用 Claude</text>
    <text x="814" y="194" font-size="12" fill="#527c6e">由 Linux 登录或重连钩子拉起</text>
    <rect x="778" y="220" width="296" height="64" rx="8" fill="#fff" stroke="#d4e9e1"/>
    <g transform="translate(791 234)" fill="none" stroke="#147d68" stroke-width="1.5" stroke-linejoin="round">
      <rect y="7" width="14" height="12" rx="2"/>
      <path d="M3 7V4a4 4 0 0 1 8 0v3"/>
    </g>
    <text x="816" y="244" font-size="12" font-weight="600" fill="#176653">操作 Windows 前，仍需本机授权</text>
    <text x="816" y="265" font-size="11" fill="#527c6e">新代理默认暂停，按需开启限时会话</text>
    <text x="778" y="305" font-size="11" fill="#548575">启动就绪与控制授权分别处理</text>
  </g>
</svg>
