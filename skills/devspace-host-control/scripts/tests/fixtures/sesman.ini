; Representative EL9 xrdp configuration. Repeated param= lines are intentional.
[Globals]
ListenPort=3350

[Security]
AllowRootLogin=false
RestrictInboundClipboard=none
RestrictOutboundClipboard=none

[Xorg]
; The executable must be first; the log path must be last.
param=/usr/libexec/Xorg
param=-config
param=xrdp/xorg.conf
param=-noreset
param=-nolisten
param=tcp
param=-logfile
param=.xorgxrdp.%s.log

[Xvnc]
param=Xvnc
param=-nolisten
param=tcp

[Chansrv]
FuseMountName=thinclient_drives
