name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Go tests
        working-directory: hostcontrol
        run: go test ./... -count=1
      - name: Go vet
        working-directory: hostcontrol
        run: go vet ./...
      - name: Configuration and desktop regression tests
        run: python -m unittest discover -s skills/devspace-host-control/scripts -p 'test_*.py' -v
      - name: Skill integrity and source consistency
        run: python scripts/verify_repository.py
      - name: Desktop installer syntax
        if: runner.os == 'Linux'
        run: |
          bash -n skills/devspace-host-control/scripts/ubuntu-desktop.sh
          bash -n skills/devspace-host-control/scripts/centos-desktop.sh
      - name: Windows launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem 'skills/devspace-host-control/scripts/*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
